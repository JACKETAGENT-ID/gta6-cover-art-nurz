<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Sunset Cover Maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="panel" aria-label="Cover controls">
    <h1>Neon Sunset<br>Cover Maker</h1>
    <p class="tagline">Your photos, three panels, one Vice City sunset — export the PNG and post it.</p>

    <h2>Photos</h2>
    <p class="hint">Click a card to work on it, upload your own photo, or paint in a sample scene. Drag the sliders to frame it.</p>
    <div id="slots" class="slots"></div>

    <div class="sliders">
      <label>Zoom <input id="zoom" type="range" min="1" max="2.5" step="0.05" value="1"><span id="zoom-out">100%</span></label>
      <label>Pan left–right <input id="pan-x" type="range" min="0" max="100" step="1" value="50"></label>
      <label>Pan up–down <input id="pan-y" type="range" min="0" max="100" step="1" value="50"></label>
    </div>
    <button id="clear-photos" type="button" class="ghost">Back to sample scenes</button>

    <h2>Layout</h2>
    <div id="layout-pick" class="picker"></div>

    <h2>Grade</h2>
    <div id="grade-pick" class="picker"></div>

    <h2>Caption</h2>
    <label>Kicker <input id="kicker" type="text" maxlength="30" value="Greetings from"></label>
    <label>Title <input id="title" type="text" maxlength="24" value="Sunset Heist"></label>
    <label>Place line <input id="place" type="text" maxlength="30" value="Vice City"></label>

    <h2>Post size</h2>
    <div id="size-pick" class="picker"></div>

    <button id="export" type="button" class="primary">Export PNG</button>
    <p id="status" role="status"></p>
  </section>

  <section class="stage" aria-label="Cover preview">
    <canvas id="preview" width="1920" height="1080"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
